<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TRIIXXRR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050308;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 16:9 GAME SCREEN */
    .game-screen {
      position: relative;

      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;

      background-image:
        url("GITHUB NEW.png");

      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;

      overflow: hidden;
    }

    /* CLICKABLE HOTSPOTS */
    .hotspot {
      position: absolute;
      display: block;
      cursor: pointer;
      z-index: 10;

      border: 2px solid red;
      border-radius: 8px;

      /* TEMPORARY — lets us see the clickable areas */
      background: rgba(255, 0, 0, 0.15);

      transition:
        transform 0.15s ease,
        filter 0.15s ease,
        background 0.15s ease;
    }

    /* HOVER EFFECT */
    .hotspot:hover {
      transform: scale(1.08);

      background: rgba(180, 120, 255, 0.20);

      filter:
        brightness(1.35)
        drop-shadow(0 0 8px #9d65ff);
    }

    /*
      ========================================
      SOCIAL GEM HOTSPOTS
      ========================================

      These are positioned vertically over
      the four gem sockets in GITHUB NEW.png.

      The red boxes are temporary so we can
      visually fine-tune their positions.
    */

    /* TWITCH — Purple Gem */
    .twitch {
      left: 5%;
      top: 32.6%;
      width: 7.2%;
      height: 12.1%;
    }

    /* INSTAGRAM — Pink Gem */
    .instagram {
      left: 5%;
      top: 47.1%;
      width: 7.2%;
      height: 12.1%;
    }

    /* TIKTOK — Blue Gem */
    .tiktok {
      left: 5%;
      top: 61.3%;
      width: 7.2%;
      height: 12.1%;
    }

    /* YOUTUBE — Red Gem */
    .youtube {
      left: 5%;
      top: 75.6%;
      width: 7.2%;
      height: 12.1%;
    }

  </style>
</head>

<body>

  <main class="game-screen">

    <!-- TWITCH -->
    <a
      class="hotspot twitch"
      href="YOUR-TWITCH-URL"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TRIIXXRR on Twitch">
    </a>

    <!-- INSTAGRAM -->
    <a
      class="hotspot instagram"
      href="YOUR-INSTAGRAM-URL"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TRIIXXRR on Instagram">
    </a>

    <!-- TIKTOK -->
    <a
      class="hotspot tiktok"
      href="YOUR-TIKTOK-URL"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TRIIXXRR on TikTok">
    </a>

    <!-- YOUTUBE -->
    <a
      class="hotspot youtube"
      href="YOUR-YOUTUBE-URL"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TRIIXXRR on YouTube">
    </a>

  </main>

</body>
</html>
