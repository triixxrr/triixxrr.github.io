<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRIIXXRR | Gaming & Streaming</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #3b1768 0%, #160d25 35%, #09070d 75%);
      color: white;
      display: flex;
      justify-content: center;
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 760px;
      padding: 70px 24px;
    }

    .logo {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow:
        0 0 12px #8c52ff,
        0 0 30px #54238f;
    }

    .tagline {
      margin-top: 8px;
      color: #cbb8e8;
      font-size: 1.05rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .intro {
      max-width: 520px;
      margin: 28px auto 38px;
      color: #d7d1df;
      line-height: 1.6;
      font-size: 1rem;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .button {
      display: block;
      padding: 18px 22px;
      border: 1px solid #7651a8;
      border-radius: 10px;
      background: rgba(28, 19, 39, 0.9);
      color: white;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #5d2b91;
      border-color: #a76aff;
      box-shadow: 0 8px 25px rgba(108, 53, 168, 0.35);
    }

    .live {
      background: linear-gradient(135deg, #65319a, #3b185d);
      border-color: #b376ff;
      font-size: 1.15rem;
    }

    .section-title {
      margin: 48px 0 18px;
      font-size: 1.35rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .games {
      color: #cbb8e8;
      line-height: 1.8;
    }

    footer {
      margin-top: 60px;
      color: #776c82;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <main class="page">

    <h1 class="logo">TRIIXXRR</h1>

    <p class="tagline">Gaming • Streaming • Clips</p>

    <p class="intro">
      Clutches, bad decisions, questionable strategies
      and the occasional heroic moment.
    </p>

    <div class="links">

      <!-- Replace # with your real links -->

      <a class="button live" href="https://www.twitch.tv/triixxrr" target="_blank">
        🟣 WATCH LIVE ON TWITCH
      </a>

      <a class="button" href="https://www.youtube.com/@TRIIXXRR" target="_blank">
        ▶ YouTube
      </a>

      <a class="button" href="https://www.instagram.com/triixxrr/" target="_blank">
        ◎ Instagram
      </a>

      <a class="button" href="https://www.tiktok.com/@triixxrr" target="_blank">
        ♪ TikTok
      </a>

    </div>

    <h2 class="section-title">Currently Playing</h2>

    <p class="games">
      Battlefield 6<br>
      World of Warcraft<br>
      Black Desert Online
    </p>

    <footer>
      ⚔️ TRIIXXRR
    </footer>

  </main>

</body>
</html>
