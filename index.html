<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TRIIXXRR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050308;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 16:9 GAME SCREEN */
    .game-screen {
      position: relative;

      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;

      background-image:
        url("gethub knight backdrop.png");

      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;

      overflow: hidden;
    }

    /* CLICKABLE HOTSPOTS */
    .hotspot {
      position: absolute;
      display: block;
      cursor: pointer;

      border: 2px solid transparent;
      border-radius: 8px;

      transition:
        transform 0.15s ease,
        filter 0.15s ease,
        background 0.15s ease;
    }

    .hotspot:hover {
      transform: scale(1.08);
      background: rgba(180, 120, 255, 0.12);

      filter:
        brightness(1.35)
        drop-shadow(0 0 8px #9d65ff);
    }

    /*
      SOCIAL BUTTON LOCATIONS

      These percentages can be adjusted later
      to sit perfectly over your artwork.
    */

    .twitch {
      left: 3%;
      bottom: 4%;
      width: 5%;
      height: 9%;
    }

    .instagram {
      left: 9%;
      bottom: 4%;
      width: 5%;
      height: 9%;
    }

    .tiktok {
      left: 15%;
      bottom: 4%;
      width: 5%;
      height: 9%;
    }

    .youtube {
      left: 21%;
      bottom: 4%;
      width: 5%;
      height: 9%;
    }
  </style>
</head>

<body>

  <main class="game-screen">

    <!-- TWITCH -->
    <a
      class="hotspot twitch"
      href="YOUR-TWITCH-URL"
      target="_blank"
      aria-label="TRIIXXRR on Twitch">
    </a>

    <!-- INSTAGRAM -->
    <a
      class="hotspot instagram"
      href="YOUR-INSTAGRAM-URL"
      target="_blank"
      aria-label="TRIIXXRR on Instagram">
    </a>

    <!-- TIKTOK -->
    <a
      class="hotspot tiktok"
      href="YOUR-TIKTOK-URL"
      target="_blank"
      aria-label="TRIIXXRR on TikTok">
    </a>

    <!-- YOUTUBE -->
    <a
      class="hotspot youtube"
      href="YOUR-YOUTUBE-URL"
      target="_blank"
      aria-label="TRIIXXRR on YouTube">
    </a>

  </main>

</body>
</html>
